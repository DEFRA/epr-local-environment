# Replaces Azure AD B2C with a local mock identity provider (mocks/B2CMock).
#
# Use it with the packaging, obligations or regulator profile, on its own or alongside
# compose.timeshift.yml:
#
#   docker compose -f compose.yml -f compose.b2cmock.yml --profile packaging up -d --build
#
# The time-shift profile needs it because the real b2clogin.com certificate is only valid for a
# ~3 month window around the real date, so OIDC discovery fails with NotTimeValid at any other
# TIMESHIFT_DATETIME. It also removes the Azure VPN requirement for signing in.
#
# The packaging and obligations .NET services only have AzureADB2C__Instance repointed. Domain,
# SignUpSignInPolicyId and the ClientIds stay as they are, because the mock answers on the real
# tenant's path shape and issues the audiences the real ClientIds expect. Sign-in resolves against
# the real seeded accounts database as usual.
#
# The regulator profile's ClientIds come from .env rather than compose.yml, so the mock cannot know
# them. Here they are replaced with fixed local ones that mocks/B2CMock/clients.json maps scopes
# onto, which also means the regulator profile needs none of its B2C secrets in .env.

# Shared by the Node frontends below.
x-node-frontend-b2cmock: &node-frontend-b2cmock
  depends_on:
    b2c-mock:
      condition: service_healthy
  volumes:
    - ./compose/certs/https/epr-local-root-ca.crt:/certs/epr-local-root-ca.crt:ro
    - ./compose/b2c-mock/forwarder.mjs:/b2c-mock-forwarder.mjs:ro
  # @defra/hapi-secure-context rebuilds the TLS trust store from Node's bundled roots plus
  # TRUSTSTORE_* variables (base64 PEM), dropping NODE_EXTRA_CA_CERTS, so the local root CA that
  # signs the mock's certificate goes in that way.
  command:
    - sh
    - -c
    - export TRUSTSTORE_EPR_LOCAL_ROOT_CA=$$(base64 -w0 /certs/epr-local-root-ca.crt); node /b2c-mock-forwarder.mjs & exec node src

services:
  b2c-mock:
    pull_policy: never
    build:
      context: ./mocks/B2CMock
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      # Containers reach the mock by service name; the browser reaches the published port. The
      # discovery document advertises whichever of the two each endpoint's caller can resolve.
      B2CMock__InternalOrigin: https://b2c-mock:8443
      B2CMock__BrowserOrigin: https://localhost:8443
      B2CMock__TenantId: 8a3f509a-c892-4bec-bfe9-d5f5cf251813
      B2CMock__Policy: B2C_1A_EPR_SignUpSignIn
      # Set to a userId from mocks/B2CMock/users.json to skip the sign-in picker entirely.
      B2CMock__AutoSelectUserId: ${B2CMOCK_AUTO_SELECT_USER_ID:-}
      # Lets the mock issue tokens that are valid on the time-shifted clock as well as the real one.
      TIMESHIFT_DATETIME: ${TIMESHIFT_DATETIME:-}
    ports:
      - "8443:8443"
    volumes:
      - ./compose/certs/https:/https:ro
      # Mounted rather than baked in so the user list can be edited with a restart, not a rebuild.
      - ./mocks/B2CMock/users.json:/app/users.json:ro
      - ./mocks/B2CMock/clients.json:/app/clients.json:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - packaging
      - obligations
      - regulator

  epr-packaging-frontend:
    depends_on:
      b2c-mock:
        condition: service_healthy
    environment:
      AzureADB2C__Instance: https://b2c-mock:8443
      # Any non-empty value: the mock does not check the client secret, but MSAL needs one to act
      # as a confidential client when it redeems the authorization code.
      AzureADB2C__ClientSecret: mock-client-secret
      # Microsoft.Identity.Web otherwise installs AadIssuerValidator, which resolves issuer aliases
      # against live Azure endpoints that will not know about b2c-mock.
      AzureADB2C__TokenValidationParameters__ValidateIssuer: "false"
      # This one reaches for real graph.microsoft.com with a client credential.
      FeatureManagement__UseGraphApiForExtendedUserClaims: "false"

  epr-facade-account-microservice:
    depends_on:
      b2c-mock:
        condition: service_healthy
    environment:
      AzureADB2C__Instance: https://b2c-mock:8443
      AzureADB2C__TokenValidationParameters__ValidateIssuer: "false"

  epr-payment-facade:
    environment:
      AzureADB2C__Instance: https://b2c-mock:8443
      AzureADB2C__TokenValidationParameters__ValidateIssuer: "false"

  epr-pom-api-web:
    environment:
      AzureADB2C__Instance: https://b2c-mock:8443
      AzureADB2C__TokenValidationParameters__ValidateIssuer: "false"

  epr-regulator-service:
    depends_on:
      b2c-mock:
        condition: service_healthy
    environment:
      AzureAdB2C__Instance: https://b2c-mock:8443
      # Fixed local values in place of the .env ones (see the top of this file). The secret can be
      # anything non-empty, as for epr-packaging-frontend.
      AzureAdB2C__ClientId: 1314697f-da55-49a1-8cfe-fb3316d3571c
      AzureAdB2C__ClientSecret: mock-client-secret
      AzureAdB2C__TokenValidationParameters__ValidateIssuer: "false"

  epr-regulator-facade:
    depends_on:
      b2c-mock:
        condition: service_healthy
    environment:
      AzureAdB2C__Instance: https://b2c-mock:8443
      # The audience mocks/B2CMock/clients.json gives tokens for the regulators-facade scope.
      AzureAdB2C__ClientId: 9d8d869e-7ec7-4635-8182-c1e62725115d
      AzureAdB2C__TokenValidationParameters__ValidateIssuer: "false"

  # The Node frontends send the browser to {instance}/.../authorize and call {instance}/.../token
  # themselves, from the one AZURE_AD_B2C_INSTANCE, so it points at the browser's address and the
  # forwarder in each container passes its own localhost:8443 on to b2c-mock. They only decode the
  # ID token, so the mock's issuer needs no override. The mock checks neither the client id nor the
  # secret, but sign-in is disabled without them.
  waste-obligations-frontend: &waste-obligations-frontend-b2cmock
    <<: *node-frontend-b2cmock
    environment:
      AZURE_AD_B2C_INSTANCE: https://localhost:8443
      AZURE_AD_B2C_CLIENT_ID: ${WasteObligationsFrontend__AzureAdB2C__ClientId:-b2c-mock-waste-obligations-frontend}
      AZURE_AD_B2C_CLIENT_SECRET: mock-client-secret

  waste-obligations-frontend-isolated: *waste-obligations-frontend-b2cmock

  waste-packaging-regulators-fe:
    <<: *node-frontend-b2cmock
    environment:
      AZURE_AD_B2C_INSTANCE: https://localhost:8443
      AZURE_AD_B2C_CLIENT_ID: b2c-mock-waste-packaging-regulators-fe
      AZURE_AD_B2C_CLIENT_SECRET: mock-client-secret

  waste-regulator-dashboard-fe:
    <<: *node-frontend-b2cmock
    environment:
      AZURE_AD_B2C_INSTANCE: https://localhost:8443
      AZURE_AD_B2C_CLIENT_ID: b2c-mock-waste-regulator-dashboard-fe
      AZURE_AD_B2C_CLIENT_SECRET: mock-client-secret
