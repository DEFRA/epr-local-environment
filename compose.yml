    env_file:
      - 'compose/cdp/aws.env'
      - 'compose/cdp/dotnet-service.env'
    environment:
      Mongo__DatabaseUri: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true&readPreference=secondaryPreferred
      AWS_ENDPOINT_URL: http://floci:4566
      AWS__AuthenticationRegion: eu-west-2
      AWS__ServiceURL: http://floci:4566
      AWS_EMF_ENABLED: false
      AWS_EMF_ENVIRONMENT: Local
      AnalyticsAuditEventProcessor__ProcessingEnabled: true
      AnalyticsAuditEventProcessor__ProcessName: analytics
      AnalyticsAuditEventProcessor__TopicArn: arn:aws:sns:eu-west-2:000000000000:waste_obligations_analytics_events
      AnalyticsAuditEventProcessor__PollIntervalSeconds: 1
      AnalyticsAuditEventProcessor__PollJitterSeconds: 0
      AnalyticsAuditEventConsumer__QueueUrl: http://floci:4566/000000000000/waste_obligations_analytics_events_queue
      Acl__Clients__Developer__Type: ApiKey
      Acl__Clients__Developer__Secret: developer-pwd
      Acl__Clients__Developer__Scopes__0: read
      Acl__Clients__Developer__Scopes__1: write
      Acl__Clients__waste-obligations-frontend__Type: ApiKey
      Acl__Clients__waste-obligations-frontend__Secret: waste-obligations-frontend-pwd
      Acl__Clients__waste-obligations-frontend__Scopes__0: read
      Acl__Clients__waste-obligations-frontend__Scopes__1: write
      Acl__Clients__epr-pom-api-web__Type: OAuth
      Acl__Clients__epr-pom-api-web__Scopes__0: read
      PrnCommonBackend__TokenEndpoint: http://wiremock/oauth2/v2.0/token
      PrnCommonBackend__ClientId: waste-obligations
      PrnCommonBackend__BaseAddress: ${WasteObligations__PrnCommonBackend__BaseAddress:-http://epr-prn-common-backend:8080/}
      WasteOrganisations__BaseAddress: ${WasteObligations__WasteOrganisations__BaseAddress:-http://waste-organisations:8080/}
      WasteOrganisations__ClientId: waste-obligations
      WasteOrganisations__ClientSecret: waste-obligations-pwd
      # The initial refresh can run before the seed container completes. Retry refresh and reference failures quickly in local use.
      OrganisationEligibility__RefreshPollingEnabled: true
      OrganisationEligibility__RefreshPollIntervalSeconds: 60
      OrganisationEligibility__ReferenceNumberRetryDelay: 00:01:00
