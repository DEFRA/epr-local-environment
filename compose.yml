services:
  asb-backend:
    depends_on:
      sqledge:
        condition: service_healthy
    pull_policy: always
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./compose/asb.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      SQL_WAIT_INTERVAL: 0
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "s4usag3s!"
      ACCEPT_EULA: "Y"
    profiles:
      - paycal
      - packaging
      - obligations
      - regulator

  asb:
    depends_on:
      asb-backend:
        condition: service_started
    pull_policy: always
    image: alpine/curl:latest
    command: [ "tail", "-f", "/dev/null" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://asb-backend:5300/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - paycal
      - packaging
      - obligations
      - regulator

  sqledge:
    pull_policy: always
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - "1433:1433"
    volumes:
      - sqledge-data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "s4usag3s!"
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      timeout: 5s
    profiles:
      - paycal
      - packaging
      - prn
      - obligations
      - regulator

  azurite:
    pull_policy: always
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    command: "azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 10000" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - paycal
      - packaging
      - obligations
      - regulator

  azurite-init:
    pull_policy: always
    image: mcr.microsoft.com/azure-cli:latest
    depends_on:
      azurite:
        condition: service_healthy
    volumes:
      - ./compose/seed-data/northbridge:/seed-data/northbridge:ro
      - ./compose/seed-data/popquest:/seed-data/popquest:ro
    entrypoint: >
      sh -c "
      az storage container create --name 'paycal' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage container create --name 'paycal-billingfilecsv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage container create --name 'paycal-billingfilejson' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage container create --name 'paycal-billingfilejsonauthorisedforfss' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage container create --name 'epr-antivirus-pom' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage container create --name 'epr-antivirus-registration' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage container create --name 'epr-antivirus-subsidiary' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage container create --name 'epr-antivirus-accreditation' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      echo 'containers created successfully' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-registration' --name '6688ed9b-ac4c-4550-b834-5698f3523597' --file '/seed-data/northbridge/Northbridge_CompanyDetails_2025.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-registration' --name '7113cc97-a799-48e4-8a5e-f214532c32e4' --file '/seed-data/northbridge/Northbridge_CompanyDetails_2026_Large.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-registration' --name 'b1df2a8b-5435-47d8-946a-07b5155b3ca4' --file '/seed-data/northbridge/Northbridge_CompanyDetails_2026_Small.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name '5ee9c2ca-0100-488a-be21-7a7f6546c913' --file '/seed-data/northbridge/Northbridge_Pom_2025H1.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name '0db4f56a-e98c-4b34-b020-9c67e2adbd5c' --file '/seed-data/northbridge/Northbridge_Pom_2025H2_Resubmission.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name 'b52aaee6-5c64-4c55-b194-6140488f6063' --file '/seed-data/northbridge/Northbridge_Pom_2026H1_Corrected.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      echo 'Northbridge seed blobs uploaded successfully' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-registration' --name 'b4c5d6e7-f8a9-4b0c-8d1e-2f3a4b5c6d78' --file '/seed-data/popquest/PopQuest_CompanyDetails_2025.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-registration' --name 'e7f8a9b0-c1d2-4e3f-8a4b-5c6d7e8f9a01' --file '/seed-data/popquest/PopQuest_CompanyDetails_2026.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name 'a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d' --file '/seed-data/popquest/PopQuest_Pom_2025H1.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name 'b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e' --file '/seed-data/popquest/PopQuest_Pom_2025H2.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name 'a7b8c9d0-e1f2-4a3b-8c4d-5e6f7a8b9c01' --file '/seed-data/popquest/PopQuest_Pom_2025H2_Resubmission.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name 'e1f2a3b4-c5d6-4e7f-8a8b-9c0d1e2f3a45' --file '/seed-data/popquest/PopQuest_Pom_2026H1.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      az storage blob upload --overwrite --container-name 'epr-antivirus-pom' --name '2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6f' --file '/seed-data/popquest/PopQuest_Pom_2026H1_Corrected.csv' --connection-string 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;' &&
      echo 'POP QUEST seed blobs uploaded successfully'
      "
    profiles:
      - paycal
      - packaging
      - obligations

  token-provider:
    image: mcr.microsoft.com/azure-cli
    volumes:
      - ~/.azure:/root/.azure
      - token-cache:/tokens
    command: >
      sh -c "az account get-access-token --resource https://sql.azuresynapse.net --query accessToken -o tsv > /tokens/sql.azuresynapse_token.txt &&
      echo 'Token retrieved' &&
      while true; do
        sleep 3000;
        az account get-access-token --resource https://sql.azuresynapse.net --query accessToken -o tsv > /tokens/sql.azuresynapse_token.txt;
        echo 'Token refreshed at' $$(date);
      done"
    healthcheck:
      test: [ "CMD", "test", "-f", "/tokens/sql.azuresynapse_token.txt" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    profiles:
      - prn

  redis:
    pull_policy: always
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8005:8001" # use http://localhost:8005/redis-stack/browser to view active keys
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
      start_interval: 1s
    profiles:
      - packaging
      - obligations
      - regulator

  cosmosdb-emulator:
    pull_policy: always
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    environment:
      PROTOCOL: https
      ENABLE_EXPLORER: "true"
      PORT: 8081
      EXPLORER_PORT: 1234
      HEALTH_PORT: 8080
      # Must match how other containers reach this service - the Cosmos Gateway
      # otherwise reports 127.0.0.1 as the physical address for follow-up requests.
      GATEWAY_PUBLIC_ENDPOINT: https://cosmosdb-emulator:8081/
    ports:
      - "8081:8081" # Cosmos Gateway/API
      - "1234:1234" # Data Explorer UI - http://localhost:1234
    healthcheck:
      test: [ "CMD", "curl", "-fk", "http://localhost:8080/ready" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
      start_interval: 1s
    profiles:
      - packaging
      - obligations
      - regulator

  cosmosdb-emulator-init:
    pull_policy: never
    build:
      context: ./mocks/CosmosDbInit
    depends_on:
      cosmosdb-emulator:
        condition: service_healthy
    environment:
      COSMOS_ENDPOINT: https://cosmosdb-emulator:8081/
      COSMOS_KEY: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
      COSMOS_DATABASE: SubmissionDB
    profiles:
      - packaging
      - obligations
      - regulator

  wiremock:
    pull_policy: always
    environment:
      TZ: Europe/London
    image: sheyenrath/wiremock.net:latest
    ports:
      - "9090:80"
    volumes:
      - ./compose/wiremock/mappings:/app/__admin/mappings
    command: ["--ReadStaticMappings", "true", "--WireMockLogger", "WireMockConsoleLogger"]
    healthcheck:
      test: [ "CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/80'" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - paycal
      - packaging
      - obligations
      - regulator

  mongodb:
    image: mongo:7.0.24
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped
    profiles:
      - packaging
      - obligations
      - regulator

  floci:
    image: floci/floci:latest
    ports:
      - 4566:4566
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped
    profiles:
      - packaging
      - obligations
      - regulator

  floci-init:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "/compose/init-floci.sh"]
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - 'compose/cdp/aws.env'
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ./compose/init-floci.sh:/compose/init-floci.sh:ro
    profiles:
      - packaging
      - obligations
      - regulator

  epr-calculator-service:
    pull_policy: always
    image: devrwdinfac1401.azurecr.io/eprcalculatorservicerepository:${EPR_CALCULATOR_SERVICE:-main-latest}
    depends_on:
      sqledge:
        condition: service_healthy
      asb:
        condition: service_healthy
      epr-calculator-api:
        condition: service_started
      azurite:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ServiceBusConnectionString: Endpoint=sb://asb-backend;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBusQueueName: defra.epr.calculator.run.local
      FUNCTIONS_WORKER_RUNTIME: dotnet
      FUNCTIONS_INPROC_NET8_ENABLED: 1
      StatusUpdateEndpoint: http://epr-calculator-api:8080/v1/internal/rpdStatus
      PrepareCalcResultEndPoint: http://epr-calculator-api:8080/v1/internal/prepareCalcResults
      # https://github.com/dotnet/runtime/issues/103063
      DOTNET_EnableWriteXorExecute: 0
      APPINSIGHTS_INSTRUMENTATIONKEY: 00000000-0000-0000-0000-000000000000
      Database:ConnectionString: "Data Source=sqledge,1433;User id=sa;Password=s4usag3s!;Initial Catalog=PayCal;TrustServerCertificate=True"
      BlobStorage:ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      BlobStorage:ResultFileCsvContainer: "paycal"
      BlobStorage:BillingFileCsvContainer: "paycal-billingfilecsv"
      BlobStorage:BillingFileJsonContainer: "paycal-billingfilejson"
      CommonDataApi:HttpClient:BaseUrl: "https://localhost:8002"
      CommonDataApi:DataLoader:Enabled: false
    ports:
      - "8001:80"
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/80' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - paycal

  epr-calculator-api:
    pull_policy: always
    image: devrwdinfac1401.azurecr.io/eprcalculatorapirepository:${EPR_CALCULATOR_API:-main-latest}
    depends_on:
      sqledge:
        condition: service_healthy
      asb:
        condition: service_healthy
      azurite:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
      epr-calculator-api-migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AzureAd__TenantId: 6f504113-6b64-43f2-ade9-242e05780007
      AzureAd__ClientId: 28b6c996-1817-4e2b-b04d-8578064d5283
      ServiceBus__ConnectionString: Endpoint=sb://asb-backend;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__QueueName: defra.epr.calculator.run.local
      Database__ConnectionString: "Data Source=sqledge,1433;User id=sa;Password=s4usag3s!;Initial Catalog=PayCal;TrustServerCertificate=True"
      BlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      BlobStorage__ResultFileCsvContainer: "paycal"
      BlobStorage__BillingFileCsvContainer: "paycal-billingfilecsv"
      BlobStorage__BillingFileJsonContainer: "paycal-billingfilejson"
      BlobStorage__FssContainer: "paycal-billingfilejsonauthorisedforfss"
    ports:
      - "5055:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/admin/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - paycal

  epr-calculator-api-migrations:
    pull_policy: always
    image: devrwdinfac1401.azurecr.io/eprcalculatorapirepository:${EPR_CALCULATOR_API_MIGRATIONS:-main-latest-database-migrations}
    command: [ "/bin/bash", "/home/nonroot/sql/run-migrations.sh", "/home/nonroot/sql/migrations.sql", "/home/nonroot/sql/seed.sql" ]
    depends_on:
      sqledge:
        condition: service_healthy
    volumes:
      - ./compose/migrations/run-migrations.sh:/home/nonroot/sql/run-migrations.sh
      - ./compose/epr-calculator-api-migrations/seed.sql:/home/nonroot/sql/seed.sql
    environment:
      SERVER: sqledge
      PORT: 1433
      USER: sa
      PASSWORD: "s4usag3s!"
      DATABASE: PayCal
    profiles:
      - paycal

  epr-calculator-frontend:
    pull_policy: always
    image: devrwdinfac1401.azurecr.io/eprcalculatorfrontendrepository:${EPR_CALCULATOR_FRONTEND:-main-latest}
    depends_on:
      sqledge:
        condition: service_healthy
      asb:
        condition: service_healthy
      epr-calculator-api:
        condition: service_started
      azurite:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
