    # No command/entrypoint/volume overrides, deliberately - this mirrors the real deploy
    # pipeline's "Docker run for migrations" step exactly (see azure-pipelines), which is just
    # `docker run --rm -e SERVER=... -e PORT=... -e USER=... -e PASSWORD=... -e DATABASE=... <image>`
    # with no extra args. That runs the image's own baked-in entrypoint/cmd - its own internal
    # migrations.sql via its own internal run-migrations.sh, completely unmodified, so this
    # container behaves exactly like a real environment's migration step. Local-only test data
    # is a separate step below (epr-payment-service-seed), because the real pipeline has no
    # equivalent of it.
    depends_on:
      sqledge:
        condition: service_healthy
      epr-payment-service-db-init:
        condition: service_completed_successfully
    environment:
      SERVER: sqledge
      PORT: 1433
      USER: sa
      PASSWORD: "s4usag3s!"
      DATABASE: EprPaymentService
    profiles:
      - packaging
      - obligations
      - regulator

