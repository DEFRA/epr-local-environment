    image: devrwdinfac1401.azurecr.io/eprpaymentbackendrepository:${EPR_PAYMENT_SERVICE_MIGRATIONS:-main-latest-database-migrations}
    # Local-dev-only: seeds Northbridge Compliance Solutions Ltd's PayCal registration fee data
    # so it survives a stack restart, matching the same SubmissionIds seeded into Cosmos/Synapse
    # (see compose/epr-payment-service-migrations/seed.sql for why this must stay in sync with
    # those). Runs after the real migrations step above completes, using our own run-migrations.sh
    # purely to execute this one local file - the real pipeline has no equivalent of this step.
    command: [ "/bin/bash", "/home/nonroot/sql/run-migrations.sh", "/home/nonroot/sql/seed.sql" ]
