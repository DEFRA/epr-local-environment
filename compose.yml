  packaging-waste-proxy:
    image: defradigital/packaging-waste-proxy:${PACKAGING_WASTE_PROXY:-latest}
    pull_policy: always
    user: "0" # needed to elevate root user so cert can be trusted
    ports:
      - "8013:8080"
      - "8015:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080;https://+:8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      # Clears the image's PORT setting so Kestrel uses the HTTP and HTTPS URLs above.
      PORT: ""
      ReverseProxy__Clusters__ManageRecyclingObligations__Destinations__Primary__Address: https://waste-obligations-frontend-isolated-proxy:443/
    depends_on:
      waste-obligations-frontend-isolated-proxy:
        condition: service_healthy
    volumes:
      - ./compose/certs/https:/https:ro
      - ./compose/certs/init-container.sh:/init-container.sh:ro
    entrypoint: [ "/init-container.sh" ]
    command: [ "dotnet", "ReverseProxy.dll" ]
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost:8081/health" ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - obligations

  epr-azure-stub:
    image: defradigital/epr-azure-stub:${EPR_AZURE_STUB:-latest}
    pull_policy: always
    env_file:
      - 'compose/cdp/aws.env'
      - 'compose/cdp/dotnet-service.env'
    ports:
      - "8011:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - packaging
      - obligations

  epr-regulator-facade:
    pull_policy: always
    image: devrwdinfac1401.azurecr.io/eprregulatorfacadeendregistry:${EPR_REGULATOR_FACADE:-main-latest}
    user: "0" # needed to elevate root user so cert can be trusted
    depends_on:
      epr-backend-account-microservice:
        condition: service_started
      epr-pom-api-submission-status:
        condition: service_started
      epr-common-data-api:
        condition: service_started
      epr-prn-common-backend:
        condition: service_started
      wiremock:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.AspNetCore: Information
      AzureAdB2C__ClientId: ${EprRegulatorFacade__AzureAdB2C__ClientId} # see .env
      AzureAdB2C__Instance: https://AZDCUSPOC2.b2clogin.com
      AzureAdB2C__Domain: AZDCUSPOC2.onmicrosoft.com
      AzureAdB2C__SignUpSignInPolicyId: B2C_1A_EPR_SignUpSignIn
      AccountsServiceApiConfig__BaseUrl: https://epr-backend-account-microservice:8081/api/
      SubmissionsApiConfig__BaseUrl: https://epr-pom-api-submission-status:8081
      CommonDataApiConfig__BaseUrl: http://epr-common-data-api:8080/api/
      PrnBackendServiceApiConfig__BaseUrl: http://epr-prn-common-backend:8080
      PaymentBackendServiceApiConfig__BaseUrl: http://wiremock
      MessagingConfig__ApiKey: ${EprRegulatorFacade__MessagingConfig__ApiKey} # see .env
    ports:
      - "5072:8080"
      - "7240:8081"
    volumes:
      - ./compose/certs/https:/https:ro
      - ./compose/certs/init-container.sh:/init-container.sh:ro
    entrypoint: [ "/init-container.sh" ]
    command: [ "dotnet", "EPR.RegulatorService.Facade.API.dll" ]
    healthcheck:
      test: [ "CMD-SHELL", "SSL_CERT_FILE=/usr/local/share/ca-certificates/epr-local-root-ca.crt wget --quiet --tries=1 --spider https://localhost:8081/admin/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - regulator

  epr-regulator-service:
    pull_policy: always
    image: devrwdinfac1401.azurecr.io/eprregulatorfrontendregistry:${EPR_REGULATOR_SERVICE:-main-latest}
    user: "0" # needed to elevate root user so cert can be trusted
    depends_on:
      redis:
        condition: service_healthy
      epr-regulator-facade:
        condition: service_started
      epr-payment-facade:
        condition: service_started
      waste-obligations-seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.AspNetCore: Information
      RedisInstanceName: epr-producers-
      ConnectionStrings__REDIS_CONNECTION: redis:6379
      UseLocalSession: false
      AzureAdB2C__ClientId: ${EprRegulatorService__AzureAdB2C__ClientId} # see .env
      AzureAdB2C__ClientSecret: ${EprRegulatorService__AzureAdB2C__ClientSecret} # see .env
      AzureAdB2C__Instance: https://AZDCUSPOC2.b2clogin.com
      AzureAdB2C__Domain: AZDCUSPOC2.onmicrosoft.com
      FacadeApi__BaseUrl: https://epr-regulator-facade:8081/api/
      EprAuthorizationConfig__FacadeBaseUrl: https://epr-regulator-facade:8081/api/
      ReprocessorExporterFacadeApi__BaseUrl: https://epr-regulator-facade:8081/api/
      PaymentFacadeApi__BaseUrl: https://epr-payment-facade:8081/
    ports:
      - "5229:8080" # taken from launch settings in epr-regulator-service
      - "7154:8081" # taken from launch settings in epr-regulator-service
    volumes:
      - ./compose/certs/https:/https:ro
      - ./compose/certs/init-container.sh:/init-container.sh:ro
    entrypoint: [ "/init-container.sh" ]
    command: [ "dotnet", "EPR.RegulatorService.Frontend.Web.dll" ]
    healthcheck:
      test: [ "CMD-SHELL", "SSL_CERT_FILE=/usr/local/share/ca-certificates/epr-local-root-ca.crt wget --quiet --tries=1 --spider https://localhost:8081/admin/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - regulator

  epr-regulator-gateway:
    image: defradigital/epr-regulator-gateway:${EPR_REGULATOR_GATEWAY:-latest}
    pull_policy: always
    depends_on:
      epr-backend-account-microservice:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      BackendAccountService__BaseUrl: http://epr-backend-account-microservice:8080/
      BackendAccountService__Scope: ""  # disables OAuth on outbound calls to the backend as per appsettings.Development.json in the repo https://github.com/DEFRA/epr-regulator-gateway/blob/444b18a5bcfa752d13cbb87c14607777ffbdc40e/EprRegulatorGateway/appsettings.Development.json#L27-L35
      Acl__Clients__Developer__Type: ApiKey
      Acl__Clients__Developer__Secret: developer-rpd
      Acl__Clients__Developer__Scopes__0: read
      Acl__Clients__Developer__Scopes__1: write
    ports:
      - "8085:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s
    profiles:
      - regulator

  waste-packaging-regulators-fe:
    image: defradigital/waste-packaging-regulators-fe:${WASTE_PACKAGING_REGULATORS_FE:-latest}
    pull_policy: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - 'compose/cdp/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_TLS: false
      USE_SINGLE_INSTANCE_CACHE: true
      AZURE_AD_B2C_CLIENT_ID: ${WastePackagingRegulatorsFe__AzureAdB2C__ClientId:-}
      AZURE_AD_B2C_CLIENT_SECRET: ${WastePackagingRegulatorsFe__AzureAdB2C__ClientSecret:-}
      AZURE_AD_B2C_INSTANCE: https://AZDCUSPOC2.b2clogin.com
      AZURE_AD_B2C_DOMAIN: AZDCUSPOC2.onmicrosoft.com
      AZURE_AD_B2C_USER_FLOW: B2C_1A_EPR_SignUpSignIn
      AZURE_AD_B2C_REDIRECT_URI: https://localhost:3000/signin-oidc
      AZURE_AD_B2C_POST_LOGOUT_REDIRECT_PATH: /signed-out
      AUTH_COOKIE_PASSWORD: secret-password-must-be-at-least-32-characters-long
      AUTH_COOKIE_SECURE: "true"
      SESSION_COOKIE_PASSWORD: the-password-must-be-at-least-32-characters-long
      SESSION_COOKIE_SECURE: "true"
      ACCOUNT_API_BASE_URL: http://epr-backend-account-microservice:8080
      WASTE_OBLIGATIONS_API_BASE_URL: http://waste-obligations:8080
      WASTE_ORGANISATIONS_API_BASE_URL: http://waste-organisations:8080
    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect({host:'127.0.0.1', port:3000}).once('connect', () => process.exit(0)).once('error', () => process.exit(1))" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
      start_interval: 1s
    profiles:
      - regulator

  waste-packaging-regulators-fe-proxy:
    image: nginx:alpine
    depends_on:
      waste-packaging-regulators-fe:
        condition: service_healthy
    ports:
      - "3000:443"
    volumes:
      - ./compose/waste-packaging-regulators-fe-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./compose/certs/https:/certs:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider --no-check-certificate https://127.0.0.1/health" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
      start_interval: 1s
    profiles:
      - regulator

  waste-regulator-dashboard-fe:
    image: defradigital/waste-regulator-dashboard-fe:${WASTE_REGULATOR_DASHBOARD_FE:-latest}
    pull_policy: always
    depends_on:
      redis:
        condition: service_healthy
      epr-regulator-gateway:
        condition: service_started
    env_file:
      - 'compose/cdp/aws.env'
    environment:
      HOST: 0.0.0.0  # image default is "localhost" — bind all interfaces so the nginx proxy can reach it
      PORT: 7154
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_TLS: false
      USE_SINGLE_INSTANCE_CACHE: true
      AZURE_AD_B2C_CLIENT_ID: ${WasteRegulatorDashboardFe__AzureAdB2C__ClientId:-}
      AZURE_AD_B2C_CLIENT_SECRET: ${WasteRegulatorDashboardFe__AzureAdB2C__ClientSecret:-}
      AZURE_AD_B2C_INSTANCE: https://AZDCUSPOC2.b2clogin.com
      AZURE_AD_B2C_DOMAIN: AZDCUSPOC2.onmicrosoft.com
      AZURE_AD_B2C_USER_FLOW: B2C_1A_EPR_SignUpSignIn
      AZURE_AD_B2C_REDIRECT_URI: https://localhost:8014/signin-oidc
      AZURE_AD_B2C_POST_LOGOUT_REDIRECT_PATH: /signed-out
      AUTH_COOKIE_PASSWORD: secret-password-must-be-at-least-32-characters-long
      AUTH_COOKIE_SECURE: "true"
      SESSION_COOKIE_PASSWORD: the-password-must-be-at-least-32-characters-long
      SESSION_COOKIE_SECURE: "true"
      GATEWAY_API_BASE_URL: http://epr-regulator-gateway:8080
      GATEWAY_API_BASIC_AUTH_USERNAME: Developer
      GATEWAY_API_BASIC_AUTH_PASSWORD: developer-rpd
      FEATURE_CERTIFICATE_OF_COMPLIANCE: "true"
      REGULATOR_AZURE_BASE_URL: https://localhost:7154
      CERTIFICATE_OF_COMPLIANCE_BASE_URL: https://localhost:3000
    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect({host:'127.0.0.1', port:7154}).once('connect', () => process.exit(0)).once('error', () => process.exit(1))" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
      start_interval: 1s
    profiles:
      - regulator

  waste-regulator-dashboard-fe-proxy:
    image: nginx:alpine
    depends_on:
      waste-regulator-dashboard-fe:
        condition: service_healthy
    ports:
      - "8014:443"
    volumes:
      - ./compose/waste-regulator-dashboard-fe-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./compose/certs/https:/certs:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider --no-check-certificate https://127.0.0.1/health" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
      start_interval: 1s
    profiles:
      - regulator

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: "true"

volumes:
  azurite-data:
  sqledge-data:
  token-cache:
  mongodb-data:
