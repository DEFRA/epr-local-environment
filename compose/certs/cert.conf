[req]
default_bits = 4096
prompt = no
default_md = sha256
distinguished_name = root_ca_dn

[root_ca_dn]
CN = EPR local environment development root CA

[root_ca]
basicConstraints = critical, CA:true
keyUsage = critical, digitalSignature, keyEncipherment, keyCertSign
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer

[server_cert]
basicConstraints = critical, CA:false
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer
subjectAltName = @alt_names

[alt_names]
DNS.1 = localhost
DNS.2 = epr-facade-account-microservice
DNS.3 = epr-backend-account-microservice
DNS.4 = epr-payment-facade
DNS.5 = epr-pom-api-web
DNS.6 = epr-pom-api-submission-status
DNS.7 = epr-regulator-facade
DNS.8 = epr-regulator-service
DNS.9 = epr-regulator-gateway
DNS.10 = waste-obligations-frontend-proxy
DNS.11 = report-packaging-proxy
DNS.12 = report-packaging-proxy-spike
DNS.13 = waste-obligations-frontend-isolated-proxy
IP.1 = 127.0.0.1
