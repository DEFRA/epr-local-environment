# Builds epr-packaging-frontend from ../epr-packaging-frontend instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-packaging-frontend:
    image: local/epr-packaging-frontend:dev
    pull_policy: build
    build:
      context: ../epr-packaging-frontend/src
      dockerfile: FrontendSchemeRegistration.UI/Dockerfile
      args:
        PAT: ${EPR_NUGET_PAT:-localhost}
