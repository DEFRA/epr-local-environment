# Builds epr-prn-obligationcalculations-function from ../epr-prn-obligationcalculations-function instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-prn-obligationcalculations-function:
    image: local/epr-prn-obligationcalculations-function:dev
    pull_policy: build
    build:
      context: ../epr-prn-obligationcalculations-function/src
      dockerfile: EPR.PRN.ObligationCalculation.Function/Dockerfile
