# Builds epr-payment-facade from ../epr-payment-facade instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-payment-facade:
    image: local/epr-payment-facade:dev
    pull_policy: build
    build:
      context: ../epr-payment-facade/src
      dockerfile: EPR.Payment.Facade/Dockerfile
