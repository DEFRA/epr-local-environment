# Builds epr-facade-account-microservice from ../epr-facade-account-microservice instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-facade-account-microservice:
    image: local/epr-facade-account-microservice:dev
    pull_policy: build
    build:
      context: ../epr-facade-account-microservice/src/FacadeAccountCreation
      dockerfile: FacadeAccountCreation.API/Dockerfile
      args:
        PAT: ${EPR_NUGET_PAT:-localhost}
