# Builds waste-obligations-frontend, waste-obligations-frontend-isolated from ../waste-obligations-frontend instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  waste-obligations-frontend:
    image: local/waste-obligations-frontend:dev
    pull_policy: build
    build:
      context: ../waste-obligations-frontend
      target: production
  waste-obligations-frontend-isolated:
    image: local/waste-obligations-frontend-isolated:dev
    pull_policy: build
    build:
      context: ../waste-obligations-frontend
      target: production
