# Builds epr-registration-validation-function-app from ../epr-registration-validation-function-app instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-registration-validation-function-app:
    image: local/epr-registration-validation-function-app:dev
    pull_policy: build
    build:
      context: ../epr-registration-validation-function-app/src
      dockerfile: EPR.RegistrationValidation.Functions/Dockerfile
