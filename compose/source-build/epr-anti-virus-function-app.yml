# Builds epr-anti-virus-function-app from ../epr-anti-virus-function-app instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-anti-virus-function-app:
    image: local/epr-anti-virus-function-app:dev
    pull_policy: build
    build:
      context: ../epr-anti-virus-function-app/EPR.Antivirus
      dockerfile: EPR.Antivirus.Function/Dockerfile
      args:
        PAT: ${EPR_NUGET_PAT:-localhost}
