# Builds epr-regulator-facade from ../epr-regulator-service-facade instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-regulator-facade:
    image: local/epr-regulator-facade:dev
    pull_policy: build
    build:
      context: ../epr-regulator-service-facade/src
      dockerfile: EPR.RegulatorService.Facade.API/Dockerfile
