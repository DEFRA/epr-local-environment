# Builds epr-pom-api-web from ../epr-pom-api-web instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-pom-api-web:
    image: local/epr-pom-api-web:dev
    pull_policy: build
    build:
      context: ../epr-pom-api-web/WebApiGateway
      dockerfile: WebApiGateway.Api/Dockerfile
      args:
        PAT: ${EPR_NUGET_PAT:-localhost}
