# Builds epr-pom-func-producer-validation from ../epr-pom-func-producer-validation instead of pulling the published image.
# See "Build services from local source" in the README.
services:
  epr-pom-func-producer-validation:
    image: local/epr-pom-func-producer-validation:dev
    pull_policy: build
    build:
      context: ../epr-pom-func-producer-validation/src
      dockerfile: EPR.ProducerContentValidation.FunctionApp/Dockerfile
