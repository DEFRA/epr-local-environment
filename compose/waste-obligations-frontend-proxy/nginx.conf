events {}

http {
  server {
    listen 443 ssl;

    ssl_certificate     /certs/aspnetapp.crt;
    ssl_certificate_key /certs/aspnetapp.key;

    location / {
      proxy_pass http://waste-obligations-frontend:3000;

      proxy_http_version 1.1;

      # Preserve the client authority, including a non-standard local port,
      # so OAuth redirect URIs match the address opened in the browser.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
