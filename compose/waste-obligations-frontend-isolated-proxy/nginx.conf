events {}

http {
  # An upstream proxy supplies the browser-facing authority in this header.
  # Direct access has no upstream proxy, so retain the browser Host header.
  map $http_x_forwarded_host $browser_host {
    ""      $http_host;
    default $http_x_forwarded_host;
  }

  server {
    listen 443 ssl;

    ssl_certificate     /certs/aspnetapp.crt;
    ssl_certificate_key /certs/aspnetapp.key;

    location = /health {
      access_log off;
      return 200;
    }

    location / {
      proxy_pass http://waste-obligations-frontend-isolated:3000;

      proxy_http_version 1.1;

      # Preserve the browser authority, including a non-standard local port.
      # When the report proxy is in front, use its forwarded public authority
      # rather than this Docker service name.
      proxy_set_header Host $browser_host;
      proxy_set_header X-Forwarded-Host $browser_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
