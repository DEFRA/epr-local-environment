services:
  # The future profile needs the existing local Common Data database lifecycle,
  # but must remain independently startable from the obligations profile.
  sqledge:
    profiles:
      - paycal
      - packaging
      - prn
      - obligations
      - regulator
      - future

  synapse-source-sync:
    profiles:
      - prn
      - obligations
      - packaging
      - regulator
      - future

  synapse-sqlserver-restore:
    profiles:
      - prn
      - obligations
      - packaging
      - regulator
      - future

  epr-prn-common-backend-migrations:
    profiles:
      - prn
      - packaging
      - obligations
      - regulator
      - future

  record-waste-packaging:
    build:
      context: ./future/record-waste-packaging
    image: epr-record-waste-packaging:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EprCommonData: "Data Source=sqledge,1433;User id=sa;Password=s4usag3s!;Initial Catalog=EprCommonData;TrustServerCertificate=True"
    depends_on:
      sqledge:
        condition: service_healthy
      synapse-sqlserver-restore:
        condition: service_completed_successfully
    ports:
      # 8012-8015 are occupied by services in the obligations profile.
      - "8016:8080"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - future

  rrepw:
    build:
      context: ./future/rrepw
    image: epr-rrepw:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EprPrnBackend: "Data Source=sqledge,1433;User id=sa;Password=s4usag3s!;Initial Catalog=EprPrnBackend;TrustServerCertificate=True"
    depends_on:
      sqledge:
        condition: service_healthy
      epr-prn-common-backend-migrations:
        condition: service_completed_successfully
    ports:
      - "8017:8080"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - future

  waste-packaging-obligations:
    build:
      context: ./future/waste-packaging-obligations
    image: epr-waste-packaging-obligations:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RecordWastePackaging__BaseUrl: http://record-waste-packaging:8080
      Rrepw__BaseUrl: http://rrepw:8080
    depends_on:
      record-waste-packaging:
        condition: service_healthy
      rrepw:
        condition: service_healthy
    ports:
      - "8018:8080"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    profiles:
      - future
